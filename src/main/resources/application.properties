spring.application.name=securefilelocker

# ---- Database (env vars - never hardcode credentials) ----
# Falls back to a local H2 file DB if DB_URL isn't set, so the app runs out of the box.
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/securelocker;MODE=MySQL}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# ---- JWT ----
# Set JWT_SECRET as an environment variable in real deployments (32+ char random string).
jwt.secret=${JWT_SECRET:change-this-to-a-long-random-secret-before-deploying-anywhere}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ---- File storage ----
app.storage.locker-dir=${LOCKER_DIR:locked_files}

# ---- Uploads ----
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB

server.port=${SERVER_PORT:8083}
