spring.application.name=securefilelocker-test

# Use in-memory H2 database for isolated, reproducible tests
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Test locker directory isolated inside target folder
app.storage.locker-dir=target/test-locker

# Test JWT settings
jwt.secret=test-secret-key-that-is-at-least-32-characters-long-for-testing-purposes
jwt.expiration-ms=3600000

spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB
